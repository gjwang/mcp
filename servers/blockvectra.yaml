id: blockvectra
name: BlockVectra MCP Server
description: >
  Hosted Streamable HTTP MCP server for agent workflows that need searchable
  integration documentation, supported-chain discovery, status and pricing
  lookups, and policy-bounded JSON-RPC reads. Keyless RPC access is restricted
  to each chain’s published public methods; indexed Data API and account tools
  require an API key.
